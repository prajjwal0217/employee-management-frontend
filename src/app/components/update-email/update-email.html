<div class="container">

    <div class="form-card">

        <div class="header">

            <div class="icon">
                ✉
            </div>

            <h2>Update Employee Email</h2>

            <p>
                Update the email address associated with an employee.
            </p>

        </div>


        <form (ngSubmit)="updateEmail()">

            <div class="form-group">

                <label for="employeeId">
                    Employee ID
                </label>

                <input
                    id="id"
                    type="number"
                    name="id"
                    [(ngModel)]="employeeUpdate.id"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter Employee ID"
                    min="1">

            </div>


            <div class="form-group">

                <label for="email">
                    New Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="employeeUpdate.email"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter new email address">

            </div>


            <button
                type="submit"
                class="submit-button"
                [disabled]="isSubmitting()">

                {{ isSubmitting() ? 'Updating...' : 'Update Email' }}

            </button>

        </form>


        @if (successMessage()) {

            <div class="success-message" role="status" aria-live="polite">

                {{ successMessage() }}

            </div>

        }


        @if (errorMessage()) {

            <div class="error-message" role="alert">

                {{ errorMessage() }}

            </div>

        }

    </div>

</div>

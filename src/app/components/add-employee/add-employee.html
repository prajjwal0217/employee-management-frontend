<div class="container">

    <div class="form-card">

        <div class="header">

            <h2>Add New Employee</h2>

            <p>
                Enter the employee information below
            </p>

        </div>

        @if (successMessage()) {

            <div class="success-message" role="status" aria-live="polite">

                {{ successMessage() }}

            </div>

        }

        @if (errorMessage()) {

            <div class="error-message" role="alert">

                {{ errorMessage() }}

            </div>

        }

        <form (ngSubmit)="addEmployee()">

            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    id="firstName"
                    type="text"
                    name="firstName"
                    [(ngModel)]="employee.firstName"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter first name">

            </div>


            <div class="form-group">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    id="lastName"
                    type="text"
                    name="lastName"
                    [(ngModel)]="employee.lastName"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter last name">

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    [(ngModel)]="employee.emailId"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter email address">

            </div>


            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select
                    id="department"
                    name="department"
                    [(ngModel)]="employee.department"
                    (ngModelChange)="clearFeedback()">

                    <option value="">
                        Select Department
                    </option>

                    @for (dept of departments; track dept) {

                        <option [value]="dept">
                            {{ dept }}
                        </option>

                    }

                </select>

            </div>


            <div class="form-group">

                <label for="salary">
                    Salary
                </label>

                <input
                    id="salary"
                    type="number"
                    name="salary"
                    [(ngModel)]="employee.salary"
                    (ngModelChange)="clearFeedback()"
                    placeholder="Enter salary">

            </div>


            <button
                type="submit"
                class="submit-button">

                Add Employee

            </button>

        </form>

    </div>

</div>
